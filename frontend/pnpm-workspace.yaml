# pnpm 설정 — 설치 시 postinstall(빌드 스크립트) 실행 허용 여부.
# sharp(이미지 최적화 바이너리)·msw는 모의/개발 환경에서 빌드 스크립트 없이 동작한다.
# 실배포에서 next/image 최적화가 필요해지면 sharp를 true로 바꾸고 재설치할 것.
allowBuilds:
  msw: false
  sharp: false

# pnpm 11부터 overrides는 package.json이 아니라 여기서 읽는다 (기존 pnpm.overrides 이관).
overrides:
  hono: 4.12.25
